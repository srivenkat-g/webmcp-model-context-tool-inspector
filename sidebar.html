<html>
  <head>
    <title>Tool Inspector</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="collapsible-header">WebMCP Tools</h2>
      <div class="section-content">

      <div id="status"></div>

      <div class="table-container">
        <table id="resultsTable">
          <thead>
            <tr id="tableHeaderRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="copyToClipboard">
          <span id="copyAsScriptToolConfig">📝 Copy as ScriptToolConfig</span>
          <span id="copyAsJSON">📝 Copy as JSON</span>
        </div>
      </div>
      </div>

      <h2 class="collapsible-header">Interact with the Page</h2>
      <div class="section-content">

      <div class="form-group">
        <div class="label-with-button">
          <label for="userPromptText">
            User Prompt&nbsp;<button id="micBtn" title="Start Gemini Live">
              <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
              </svg>
              <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <path d="M6 6h12v12H6z" />
              </svg>
            </button>
          </label>
          <div style="display: flex; align-items: center; gap: 4px;">
            <select id="modelSelect" class="model-select-dropdown" title="Choose Basecamp Model">
              <option value="gemini-3.8-flash">gemini-3.8-flash (Default)</option>
              <option value="gemini-3.7-flash">gemini-3.7-flash</option>
              <option value="claude-opus-5-5">claude-opus-5-5</option>
              <option value="claude-fable-5-1">claude-fable-5-1</option>
              <option value="claude-opus-5">claude-opus-5</option>
              <option value="deepseek-v4.1-flash">deepseek-v4.1-flash</option>
              <option value="glm-5.3-flash">glm-5.3-flash</option>
              <option value="glm-5.3">glm-5.3</option>
              <option value="glm-5.2">glm-5.2</option>
              <option value="qwen-3.8-max">qwen-3.8-max</option>
            </select>
            <button id="advancedBtn" title="Advanced features" popovertarget="advancedSection" class="icon-btn">︙</button>
          </div>
        </div>
        <textarea id="userPromptText"></textarea>
      </div>

      <dialog id="advancedSection" popover autofocus>
        <div class="menu-label">LLM Provider</div>
        <label class="model-option">
          <input type="radio" name="provider" value="basecamp" checked>
          <span>Rubrik Basecamp (Internal)</span>
        </label>
        <label class="model-option">
          <input type="radio" name="provider" value="gemini">
          <span>Google Gemini API</span>
        </label>

        <div class="menu-label">Basecamp Model</div>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="gemini-3.8-flash" checked>
          <span>gemini-3.8-flash (Default)</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="gemini-3.7-flash">
          <span>gemini-3.7-flash</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="claude-opus-5-5">
          <span>claude-opus-5-5</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="claude-fable-5-1">
          <span>claude-fable-5-1</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="claude-opus-5">
          <span>claude-opus-5</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="deepseek-v4.1-flash">
          <span>deepseek-v4.1-flash</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="glm-5.3-flash">
          <span>glm-5.3-flash</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="glm-5.3">
          <span>glm-5.3</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="glm-5.2">
          <span>glm-5.2</span>
        </label>
        <label class="model-option">
          <input type="radio" name="basecampModel" value="qwen-3.8-max">
          <span>qwen-3.8-max</span>
        </label>

        <div class="menu-label">Direct Gemini Model</div>
        <label class="model-option">
          <input type="radio" name="model" value="gemini-3.6-flash">
          <span>Gemini 3.6 Flash</span>
        </label>
        <label class="model-option">
          <input type="radio" name="model" value="gemini-3.5-flash">
          <span>Gemini 3.5 Flash</span>
        </label>
        <div class="menu-label">Advanced Options</div>
        <label class="model-option">
          <input type="checkbox" id="suggestUserPromptCheckbox">
          <span>Suggest user prompt</span>
        </label>
      </dialog>

      <div class="form-group">
        <button id="promptBtn" disabled>Send</button>
        <button id="auditRecipeBtn" class="secondary" disabled title="Audit Salesforce Protection & Generate Script">⚡ Audit &amp; Script</button>
        <button id="resetBtn" class="secondary" disabled>Reset</button>
        <button id="apiKeyBtn" class="secondary">Set Gemini API key</button>
        <button id="traceBtn" class="secondary">Copy trace</button>
      </div>

      <pre id="promptResults"></pre>

      <div class="form-group">
        <label for="toolNames">Tool</label>
        <select id="toolNames"></select>
      </div>

      <div class="form-group">
        <label for="inputArgsText">Input Arguments</label>
        <textarea id="inputArgsText">{"text": "hello world"}</textarea>
      </div>

      <div class="form-group">
        <button id="executeBtn">Execute Tool</button>
      </div>

      <pre id="toolResults"></pre>
      </div>
    </div>
    <script type="module" src="sidebar.js"></script>
  </body>
</html>
